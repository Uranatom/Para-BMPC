[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "para-bmpc-review"
version = "0.1.0"
description = "Review-stage baseline implementations and frozen benchmark results for Para-BMPC"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
para-bmpc-baseline = "review_bmpc.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
